$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [schema_version, id, name, manufacturer, family, type, version, description, kinematics, actuators, capabilities, control_schemes, adapters]
properties:
  schema_version: {const: '1.0'}
  id: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
  name: {type: string, minLength: 1}
  manufacturer: {type: string}
  family: {type: string}
  type: {type: string}
  version: {type: string}
  description: {type: string}
  kinematics: {type: string}
  actuators: {type: string}
  capabilities: {type: string}
  control_schemes: {type: object, minProperties: 1, additionalProperties: {type: string}}
  adapters: {type: object, minProperties: 1, additionalProperties: {type: string}}
