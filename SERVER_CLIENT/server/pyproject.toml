[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-ide-runtime"
version = "0.4.0"
requires-python = ">=3.11"
description = "Shared Robot IDE server: planning, IK, validation, adapters and execution"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*", "robot_system*", "simulation*", "integrations*", "examples*", "web*"]
exclude = ["robot_system.runtime*", "examples.models*", "examples.projects*"]
namespaces = true

[tool.setuptools.package-data]
shared = ["models/*.yaml"]
robot_system = ["registry/**/*.yaml"]
web = ["static/*.svg"]
